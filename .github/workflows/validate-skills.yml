name: Validate skills
on:
  push:
    paths: ['skills/**', '.claude-plugin/marketplace.json', 'scripts/validate_skills.py', 'requirements-dev.txt', '.github/workflows/validate-skills.yml']
  pull_request:
    paths: ['skills/**', '.claude-plugin/marketplace.json', 'scripts/validate_skills.py', 'requirements-dev.txt', '.github/workflows/validate-skills.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
